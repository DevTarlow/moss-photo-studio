appId: com.mosstoolbox.photostudio
productName: Moss Photo Studio
copyright: Copyright © 2026 Moss AI Studio
directories:
  buildResources: resources/brand
  output: release
# Ship only the compiled app. Source, tests, docs, and sourcemaps stay out.
asar: true
files:
  - out/**/*
  - package.json
extraResources:
  - from: resources
    to: resources
asarUnpack:
  - node_modules/sharp/**/*
  - node_modules/@img/**/*
linux:
  target:
    - AppImage
    - deb
  category: Graphics
  icon: icon.png
  syncDesktopName: true
  artifactName: Moss-Photo-Studio-${version}-${arch}.${ext}
win:
  target:
    - nsis
  icon: icon.ico
  artifactName: Moss-Photo-Studio-${version}-Setup.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
mac:
  target:
    - dmg
  icon: icon.icns
  category: public.app-category.photography
  artifactName: Moss-Photo-Studio-${version}-${arch}.${ext}
dmg:
  title: Moss Photo Studio ${version}
publish:
  provider: github
  owner: DevTarlow
  repo: moss-photo-studio
  releaseType: release
npmRebuild: false
